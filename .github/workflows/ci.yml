name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [clang, gcc]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Kestrel
        env:
          CC: ${{ matrix.compiler }}
        run: make

      - name: Run Test Suite
        env:
          CC: ${{ matrix.compiler }}
        run: make test

      - name: Run Sanitizer Suite (ASan & UBSan)
        env:
          CC: ${{ matrix.compiler }}
        run: make sanitize
